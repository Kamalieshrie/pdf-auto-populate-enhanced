<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for modern look -->
    <linearGradient id="loadingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Pulsing gradient -->
    <radialGradient id="pulseGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.6">
        <animate attributeName="stop-opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0">
        <animate attributeName="stop-opacity" values="0;0.3;0" dur="2s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>
  </defs>
  
  <!-- Background container -->
  <rect x="10" y="20" width="100" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Document icon with pulse effect -->
  <g transform="translate(20, 28)">
    <!-- Pulsing background -->
    <circle cx="12" cy="12" r="15" fill="url(#pulseGradient)"/>
    
    <!-- Document shape -->
    <path d="M6 4 h12 l4 4 v12 a2 2 0 0 1-2 2 H6 a2 2 0 0 1-2-2 V6 a2 2 0 0 1 2-2 Z" 
          fill="#3B82F6" opacity="0.9">
      <animateTransform attributeName="transform" attributeType="XML" 
                       type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Document corner -->
    <path d="M18 4 v4 h4" fill="none" stroke="white" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Loading lines inside document -->
    <rect x="8" y="8" width="8" height="1" fill="white" opacity="0.8">
      <animate attributeName="width" values="0;8;8;0" dur="3s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="8" y="11" width="6" height="1" fill="white" opacity="0.8">
      <animate attributeName="width" values="0;6;6;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    <rect x="8" y="14" width="10" height="1" fill="white" opacity="0.8">
      <animate attributeName="width" values="0;10;10;0" dur="3s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <rect x="8" y="17" width="7" height="1" fill="white" opacity="0.8">
      <animate attributeName="width" values="0;7;7;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
  </g>
  
  <!-- Animated dots -->
  <g transform="translate(55, 35)">
    <circle cx="0" cy="5" r="2" fill="#3B82F6">
      <animate attributeName="cy" values="5;0;5" dur="1.5s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="8" cy="5" r="2" fill="#3B82F6">
      <animate attributeName="cy" values="5;0;5" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="16" cy="5" r="2" fill="#3B82F6">
      <animate attributeName="cy" values="5;0;5" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>
  
  <!-- Progress bar -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="80" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="0" y="0" width="80" height="4" rx="2" fill="url(#loadingGradient)">
      <animate attributeName="x" values="-80;80;80;-80" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Loading text -->
  <text x="60" y="70" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="500">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    Processing...
  </text>
  
  <!-- Spinning loader (alternative design) -->
  <g transform="translate(95, 35)" opacity="0.7">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#E5E7EB" stroke-width="2"/>
    <path d="M0,-8 A8,8 0 0,1 5.66,-5.66" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" attributeType="XML" 
                       type="rotate" values="0;360" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>